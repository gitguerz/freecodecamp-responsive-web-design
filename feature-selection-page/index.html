<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feature Selection</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">MAKE IT YOURS</p>
    <h1>Feature Selection</h1>
    <p class="intro">Choose the extras for your listening space.</p>
    <div class="feature-card-container">
      <!-- small is for side-comment text: a quieter sub-line under the strong title -->
      <label class="feature-card"><input type="checkbox" name="features" value="radio"><span><strong>Endless radio</strong><small>Keep the music flowing.</small></span></label>
      <label class="feature-card"><input type="checkbox" name="features" value="focus"><span><strong>Focus mode</strong><small>Less noise. More headspace.</small></span></label>
      <label class="feature-card"><input type="checkbox" name="features" value="discovery"><span><strong>Deep cuts</strong><small>Find your next favorite track.</small></span></label>
      <label class="feature-card"><input type="checkbox" name="features" value="offline"><span><strong>Offline listening</strong><small>Take your collection along.</small></span></label>
    </div>
    <p class="hint">Select any combination. Change it whenever.</p>
  </main>
</body>
</html>
