<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confidential Email</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="email">  <!-- main = the page's one main content area; id lets CSS target it with #email -->
    <div id="confidential">CONFIDENTIAL</div>
    <h1>Operation Midnight Sloth</h1>
    <p>Agent Guerz, your next assignment begins at <span class="blurred">midnight</span>.</p>  <!-- span = inline wrapper, so only these words get blurred -->
    <p>Meet your contact at <span class="blurred">the abandoned record store</span>. Bring the lavender briefcase.</p>
    <p>The access phrase is <span class="blurred">prepared, Frederick</span>. Destroy this message after reading.</p>
    <div id="top-secret">TOP SECRET</div>
  </main>
</body>
</html>
