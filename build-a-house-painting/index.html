<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Midnight Cottage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>The Midnight Cottage</h1>
  <p>lights on. world off.</p>
  <div id="house" role="img" aria-label="A peach cottage with a lavender roof, chimney, two glowing windows, and a purple door beneath a night sky.">  <!-- role="img" + aria-label: tells screen readers this CSS drawing is one image, and describes it -->
    <div id="chimney"></div>
    <div id="roof"></div>
    <div id="window-1"></div>
    <div id="window-2"></div>
    <div id="door"></div>
  </div>
</body>
</html>
