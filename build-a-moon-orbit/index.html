<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build a Moon Orbit</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="space" role="img" aria-label="The Moon orbiting Earth">
      <div class="earth"></div>
      <div class="orbit">  <!-- the orbit is the ring that spins; the moon sits on its edge, so it travels around Earth as the ring turns -->
        <div class="moon"></div>
      </div>
    </div>
  </body>
</html>
