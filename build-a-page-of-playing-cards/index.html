<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playing Cards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Playing Cards</h1>
    <main id="playing-cards">
      <div class="card">
        <div class="left">A<br />&#9824;</div>  <!-- &#9824; = HTML character entity for the spade symbol -->
        <div class="middle">
          <span>&#9824;</span>
          <span>&#9824;</span>
          <span>&#9824;</span>
        </div>
        <div class="right">A<br />&#9824;</div>
      </div>
      <div class="card red">
        <div class="left">10<br />&#9829;</div>
        <div class="middle">
          <span>&#9829;</span>
          <span>&#9829;</span>
          <span>&#9829;</span>
        </div>
        <div class="right">10<br />&#9829;</div>
      </div>
      <div class="card">
        <div class="left">K<br />&#9827;</div>
        <div class="middle">
          <span>&#9827;</span>
          <span>&#9827;</span>
          <span>&#9827;</span>
        </div>
        <div class="right">K<br />&#9827;</div>
      </div>
    </main>
  </body>
</html>
