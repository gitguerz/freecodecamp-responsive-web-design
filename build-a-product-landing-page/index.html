<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bedmixing</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header id="header">
      <img
        id="header-img"
        src="https://guerz.lol/favicon-peach.png"
        alt="Guerz Logo"
      >
      <nav id="nav-bar" aria-label="Main navigation">
        <a class="nav-link" href="#features">Features</a>
        <a class="nav-link" href="#video-section">Watch</a>
        <a class="nav-link" href="#signup">Sign Up</a>
      </nav>
    </header>

    <main>
      <section id="hero">
        <h1>Guerz</h1>
        <p>))&lt;&gt;(( Back and Forth Forever and Ever</p>
      </section>

      <section id="features">
        <h2>Twitch VOD</h2>
        <div class="feature-list">
          <div class="feature">
            <h3>twitch.tv/guerz</h3>
            <p>Live Stream DJ Set</p>
          </div>
        </div>
      </section>

      <section id="video-section">
        <h2>Bedmixing</h2>
        <iframe
          id="video"
          src="https://www.youtube.com/embed/-4jzAhnYRsQ"
          title="Guerz: Bedmixing DJ set"
          allowfullscreen
        ></iframe>  <!-- iframe embeds another page (here a YouTube video) inside this one -->
      </section>

      <section id="signup">
        <h2>Get Guerz Updates</h2>
        <form
          id="form"
          action="https://www.freecodecamp.org/email-submit"
          method="post"
        >  <!-- the form sends its fields to the action url; method post puts them in the request body, not the url -->
          <label for="email">Email address</label>
          <input
            id="email"
            type="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >
          <input id="submit" type="submit" value="Sign Up">  <!-- type=submit makes a button that sends the form; value is its label -->
        </form>
      </section>
    </main>

    <footer id="footer">
      <p>Guerz - Bedmixing</p>
    </footer>
  </body>
</html>
